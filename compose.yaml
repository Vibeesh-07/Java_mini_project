services:
  db:
    image: mysql:8.0
    container_name: refind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: refind_db
      MYSQL_USER: refind_user
      MYSQL_PASSWORD: refind_password
    ports:
      - "${MYSQL_LOCAL_PORT:-3307}:3306"
    volumes:
      - refind-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refind-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLDATABASE: refind_db
      MYSQLUSER: refind_user
      MYSQLPASSWORD: refind_password
      ADMIN_BOOTSTRAP_ENABLED: "true"
      ADMIN_EMAIL: admin@refind.campus
      ADMIN_PASSWORD: Admin@12345
      ADMIN_NAME: System Administrator
    depends_on:
      db:
        condition: service_healthy

volumes:
  refind-mysql-data:
    name: refind-mysql-data
