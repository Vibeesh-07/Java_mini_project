<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — PSG iTech Lost &amp; Found</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="brand-logo">
        <img src="/images/psg-itech-logo.png" class="college-logo" alt="PSG iTech logo">
        <span class="brand-name">PSG <span class="highlight">iTech</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/browse.html" class="nav-link">Browse Items</a></li>
        <li><a href="/report.html" class="nav-link">Report Item</a></li>
      </ul>

      <div class="nav-actions">
        <a href="/register.html" class="btn btn-outline-primary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container" style="max-width: 460px;">
      <div class="card" style="box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p>Sign in to manage reports, claims, and matches</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Campus Email</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@psgitech.ac.in" required autocomplete="email">
            <div id="err-login-email" class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div style="position: relative;">
              <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right: 2.75rem;">
              <button type="button" id="toggle-password" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.25rem;" aria-label="Toggle password visibility">
                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div id="err-login-password" class="form-error"></div>
          </div>

          <div id="login-error" class="form-error" style="margin-bottom: 1.25rem;"></div>
          <div id="login-success" class="form-success" style="margin-bottom: 1.25rem;"></div>

          <button type="submit" id="btn-login-submit" class="btn btn-primary btn-full" style="height: 2.85rem;">
            Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account yet? <a href="/register.html" style="font-weight: 600;">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <div><strong>PSG iTech</strong> &mdash; Lost &amp; Found Portal</div>
      <div>Served directly via Spring Boot &bull; Vanilla JS &bull; Railway Ready</div>
    </div>
  </footer>

  <script src="/js/api.js?v=csp-fix-20261118"></script>
  <script src="/js/login.js?v=csp-fix-20261118"></script>
</body>
</html>
